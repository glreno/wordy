FEATURES {
    # There's a reason everyone uses $2000 here.
    # Increasing it by 410 to make room for the screen.
    STARTADDRESS: default = $2000;
}
SYMBOLS {
    __EXEHDR__:          type = import;
    __AUTOSTART__:       type = import;  # force inclusion of autostart "trailer"
    __STACKSIZE__:       type = weak,   value = $0200; # 512 byte stack
    __STARTADDRESS__:    type = export, value = %S;
    FONTSPACE:           type = export, value = 2*$400;
    PAGESPACE:           type = export, value = 1*$800; # one page in reserved space, the others are in volatile areas around 9C20 and BC20
    SCREENSIZE:          type = export, value = $410;
    __RESERVED_MEMORY__: type = export, value = $8000+$410-$3E0+PAGESPACE; # 32K, I want MAIN below the 130XE bank.
    # Plus the screensize MINUS the default screen size of 3E0; screen will thus start at 2BF0

    TITLE_BANK_ID:       type = export, value=4; # bank that the TITLEPAGE is in
    STARTUP_BANK_ID:     type = export, value=4; # bank that the STARTUP,ONCE,GAMEINIT,DATA segments are in, same as TITLE, probably
    FONTDATA_BANK_ID:    type = export, value=4; # bank that the font data segments are in, same as STARTUP, probably
    DICT_BANK_1_ID:    type = export, value=0; # ID of dictionary cart bank
    DICT_BANK_2_ID:    type = export, value=0; # ID of dictionary cart bank
    DICT_IDX_ID:       type = export, value=1; # ID of dictionary index cart bank
    DICT_BANK_3_ID:    type = export, value=1; # ID of dictionary cart bank
    DICT_BANK_4_ID:    type = export, value=1; # ID of dictionary cart bank
    OPTIONS_BANK_ID:   type = export, value=4; # ID of options screen cart bank (in with the startup code)
    VOR_CODE_BANK_ID:  type = export, value=2; # ID of opponent view (code)
    VOR_IDX_BANK_ID:   type = export, value=2; # ID of opponent view (pic index)
    VOR_PICS0_BANK_ID: type = export, value=2; # ID of view (pic data)
    VOR_PICS1_BANK_ID: type = export, value=2; # ID of view (pic data)
    VOR_PICS2_BANK_ID: type = export, value=2; # ID of view (pic data)
    VOR_PICS4_BANK_ID: type = export, value=3; # ID of view (pic data)
    VOR_PICS5_BANK_ID: type = export, value=2; # ID of view (pic data)
    CUEBALL_BANK_ID:   type = export, value=3; # ID of cueball (audio cues) must be same bank as TRAMPOLINED
    TRAMPOLINE_BANK_ID:  type = export, value=3; # bank that the trampoline code is in
}
MEMORY {
#
# 130XE LAYOUT
#
# 0000-3FFF (00-16K) ZP,MAIN, and the reserved memory: Just like a 600XL!
# 4000-7FFF (16-32K) Five bank-switched blocks at the same address.
# 8000-BFFF (32-48K) the 16K where the cartridge would be. (BASIC can be bankswitched in)
# C000-CFFF (48-52K) OS, but there is RAM to be banked in
# D800-FFFF (54-64K) OS, but there is RAM to be banked in
# Call them XE0,1,2,3,4 -- 4 is the underlying low RAM

# Banks XE0 and XE1 are dictionary banks

    ZP:         file = "", define = yes, start = $0082, size = $007E;
    BITBUCKET:  file = "",               start = $1000, size = $4000;

# file header, just $FFFF
    HEADER:     file = %O,               start = $0000, size = $0002;

####################
# 0400-2000         DOS. Do not write here!
#                   It's free after startup though.
#      0400-13FF    Unused (4kb)
#      1400-17FF    FONTLIST2[0] (1kb)
#      1800-1BFF    FONTLIST2[1] (1kb)
#      1C00-1FFF    FONTLIST2[2] (1kb)

####################
# 2E00-2F00 (transient) 130XE check. This will show an error on anything but a 130XE, and then hang.
    XECHKHDR:  file = %O,               start = $0000, size = $0004;
    XECHKCHNK: file = %O,define = yes,  start = $2E00, size = $0100;
    XECHKTRL:  file = %O,               start = $0000, size = $0006;

####################
# 2E00-2F00 (transient) Disable built-in BASIC on XL
    BASICCHKHDR:  file = %O,               start = $0000, size = $0004;
    BASICCHKCHNK: file = %O,define = yes,  start = $2E00, size = $0100;
    BASICCHKTRL:  file = %O,               start = $0000, size = $0006;

####################
# 9C00-9E00 (main)  Title screen "LOADING ROBOT"
    TITLEHDR:   file = %O,               start = $0000, size = $0004;
    TITLE:      file = %O, define = yes, start = $AF00, size = $017E;
    TITLETRL:   file = %O,               start = $0000, size = $0006;

####################
# 2000-3BEF         "main program" load chunk. SCREENRAM is at 3BF0.
# A copyright, LOWCODE, LOWBSS, BSS, then heap and stack
    MAINHDR:    file = %O,               start = $0000, size = $0004;
    MAIN:       file = %O, define = yes, start = %S,    size = $BC20 - __STACKSIZE__ - __RESERVED_MEMORY__ - %S;


####################
# 4000-8000 (XE2)   "Robot pics" load chunk - bank XE2 - the image data that used to be scattered all over the place
    XEBANK2_LOAD: file = %O,             start = $0000, size = $0005;
    XEBANK2_HDR:     file = %O,               start = $0000, size = $0004;
    VOR:        file = %O, define = yes, start = $4000, size = $3F97;


####################
# 9E00-A100 (main)  Credits screen "LOADING DICTIONARY."
    TITLECHDR:  file = %O,               start = $0000, size = $0004;
    TITLECRED:  file = %O, define = yes, start = $B45C, size = $0292;
    TITLECTRL:  file = %O,               start = $0000, size = $0006;


####################
# 4000-8000 (XE0)   "Dictionary" load chunk - the four DICT segments - banks XE0 and XE1
    XEBANK0_LOAD: file = %O,             start = $0000, size = $0005;
    XEBANK0_HDR:  file = %O,               start = $0000, size = $0004;
    DICT0:        file = %O, define = yes, start = $4000, size = $4000;

####################
# A100-A500 (main) License screen "LOADING DICTIONARY.."
    TITLELHDR:  file = %O,               start = $0000, size = $0004;
    TITLELIC:   file = %O, define = yes, start = $B091, size = $03CB;
    TITLELTRL:  file = %O,               start = $0000, size = $0006;

####################
# 4000-8000 (XE1)   "Dictionary" load chunk - the four DICT segments - banks XE0 and XE1
    XEBANK1_LOAD: file = %O,               start = $0000, size = $0005;
    XEBANK1_HDR:  file = %O,               start = $0000, size = $0004;
    DICT1:        file = %O, define = yes, start = $4000, size = $4000;

####################
# 5000-5600 (XE3)   "trampoline" load chunk - XE3
# TRAMPOLINED goes here, as well as CUEBALL which has to be in the same bank
# TRAMPOLINED CUEBALL VOR_PICS4
    XEBANK3_LOAD: file = "%O",           start = $0000, size = $0005;
    TRAMPHDR:   file = %O,               start = $0000, size = $0004;
    TRAMP:      file = %O, define = yes, start = $4000, size = $2000;

####################
# A000-AF00         "Big segments" load chunk - the bulk of the game
# MD DS DA DATA
    BIG2HDR:    file = %O,               start = $0000, size = $0004;
    BIG2:       file = %O, define = yes, start = $A000, size = $0F00;

####################
# A500-A600 (main)  Instruction screen "LOADING GAME..."
    TITLEIHDR:  file = %O,               start = $0000, size = $0004;
    TITLEINST:  file = %O, define = yes, start = $B6EE, size = $0112;
    TITLEITRL:  file = %O,               start = $0000, size = $0006;

####################
# 8200-9C00         "Big segments" load chunk - the bulk of the game
# CODE APP TRAMPOLINES GAMEINIT VIEW
    BIG1HDR:    file = %O,               start = $0000, size = $0004;
    BIG1:       file = %O, define = yes, start = $8000, size = $1800;

####################
# 5600-6700 (XE4)   "Once" load chunk - XE4 - the rest of the stuff that doesn't fit in BIG & TITLE
# FONTDATA STARTUP ONCE
    XEBANK4_LOAD: file = %O,             start = $0000, size = $0005;
    FONTSHDR:   file = %O,               start = $0000, size = $0004;
    FONTS:      file = %O, define = yes, start = $4000, size = $1800;

####################
# And start the application
    TRAILER:    file = %O,               start = $0000, size = $0006;

####################
# After startup:
#      0800-0BFF    FONTLIST1[0] (1kb)
#      0C00-0FFF    FONTLIST1[1] (1kb)
#      1000-13FF    FONTLIST1[2] (1kb)
#      1400-17FF    FONTLIST2[0] (1kb)
#      1800-1BFF    FONTLIST2[1] (1kb)
#      1C00-1FFF    FONTLIST2[2] (1kb)
#      2000-3800    lowcode, lowbss, bss, heap, stack, screen
#      2BF0         screen ram
#      3800-3FFF    PAGES[0] (2kb)
#      4000-7FFF    bankswitch area
#      8000-97FF    BIG1
#      9800-9FFF    PAGES[1] (2kb) (because this range gets wiped on warmstart when BASIC is there)
#      A000-AEFF    BIG2
#      AF00-B7FF    TITLE pages
#      B800-BFFF    PAGES[2] (2kb) (because this range gets wiped on warmstart when BASIC is disabled)


}

SEGMENTS {
    # not on disk
    ZEROPAGE:  load = ZP,         type = zp;
    EXTZP:     load = ZP,         type = zp,                optional = yes;
    EXEHDR:    load = HEADER,     type = ro;

    # Disable built-in BASIC on XL
    BASICCHKHDR: load = BASICCHKHDR,  type = ro,                optional = yes;
    BASICCHK:    load = BASICCHKCHNK, type = rw,  define = yes, optional = yes;
    BASICCHKTRL: load = BASICCHKTRL,  type = ro,                optional = yes;

    # system check load chunk
    XECHKHDR: load = XECHKHDR,  type = ro,                optional = yes;
    XECHK:    load = XECHKCHNK, type = rw,  define = yes, optional = yes;
    XECHKTRL: load = XECHKTRL,  type = ro,                optional = yes;

    XEBANK3_LOAD:  load = XEBANK3_LOAD,   type = ro,                optional = yes;
    XEBANK4_LOAD:  load = XEBANK4_LOAD,   type = ro,                optional = yes;

    # Title load chunk - main
    TITLE_HDR:    load = TITLEHDR, type = ro;
    TITLE_PAGE:   load = TITLE,    type = rw,  define = yes;
    TITLE_TRL:    load = TITLETRL, type = ro;

    COPYRIGHT_ROM: load = BITBUCKET, type = ro,  define = yes;
    # main load chunk - includes LOWCODE and LOWBSS, where the bankswitch code is
    MAINHDR:   load = MAINHDR,    type = ro;
    COPYRIGHT: load = MAIN,   type = ro,  define = yes;
    INIT:      load = MAIN,       type = ro, define = yes, optional = yes;
    LOWCODE:   load = MAIN, type = ro,  define = yes, optional = yes;
    STARTUP:   load = MAIN,   type = ro,  define = yes;
    RODATA:    load = MAIN,     type = ro,  define = yes;
    LOWBSS:    load = MAIN, type = rw, define = yes, optional = yes;  # not zero initialized but not bss because the linker doesn't like more than one bss in a chunk.
    BSS:       load = MAIN,       type = bss, define = yes;

    # Title load chunk - credits
    TITLEC_HDR:   load = TITLECHDR, type = ro;
    TITLEC_PAGE:  load = TITLECRED, type = rw,  define = yes;
    TITLEC_TRL:   load = TITLECTRL, type = ro;

    # Title load chunk - instructions
    TITLEI_HDR:   load = TITLEIHDR, type = ro;
    TITLEI_PAGE:  load = TITLEINST, type = ro,  define = yes;
    TITLEI_TRL:   load = TITLEITRL, type = ro;

    # Title load chunk - license
    TITLEL_HDR:   load = TITLELHDR, type = ro;
    TITLEL_PAGE:  load = TITLELIC,  type = rw,  define = yes;
    TITLEL_TRL:   load = TITLELTRL, type = ro;

    # Dictionary load chunk
    XEBANK0_LOAD: load = XEBANK0_LOAD,  type = ro,                optional = yes;
    XEBANK0_HDR:   load = XEBANK0_HDR, type = ro;
    DICT_BANK_C_1: load = BITBUCKET,type = ro,    define = yes;
    DICT_BANK_C_2: load = BITBUCKET,type = ro,    define = yes;
    DICT_BANK_1:   load = DICT0,    type = ro,    define = yes;
    DICT_BANK_2:   load = DICT0,    type = ro,    define = yes;

    XEBANK1_LOAD: load = XEBANK1_LOAD,  type = ro,                optional = yes;
    XEBANK1_HDR:   load = XEBANK1_HDR, type = ro;
    DICT_BANK_C_3: load = BITBUCKET,type = ro,    define = yes,   optional = yes;
    DICT_BANK_C_4: load = BITBUCKET,type = ro,    define = yes,   optional = yes;
    DICT_BANK_3:   load = DICT1,    type = ro,    define = yes,   optional = yes;
    DICT_BANK_4:   load = DICT1,    type = ro,    define = yes,   optional = yes;
    DICT_IDX:      load = DICT1,    type = ro,    define = yes;

    # Robot pics load chunk
    XEBANK2_LOAD: load = XEBANK2_LOAD,  type = ro,                optional = yes;
    XEBANK2_HDR:  load = XEBANK2_HDR,   type = ro;
    VOR_PICS0:   load = VOR,     type = ro,  define = yes, optional = yes;
    VOR_PICS1:   load = VOR,     type = ro,  define = yes, optional = yes;
    VOR_PICS2:   load = VOR,     type = ro,  define = yes, optional = yes;
    VOR_PICS3:   load = VOR,     type = ro,  define = yes, optional = yes;
    VOR_PICS5:   load = VOR,     type = ro,  define = yes, optional = yes;
    VOR_IDX:     load = VOR,     type = ro,  define = yes;
    VOR_VIEW:    load = VOR,     type = ro,  define = yes;
    VOR_CODE:    load = VOR,     type = ro,  define = yes;


    # Big segments load chunk
    BIG1HDR:   load = BIG1HDR, type = ro;
    CODE:      load = BIG1,     type = ro,  define = yes;
    APP:       load = BIG1,     type = ro,  define = yes;
    TRAMPOLINES:   load = BIG1, type = ro,  define = yes;
    GAMEINIT:  load = BIG1,     type = ro,  define = yes;
    VIEW:      load = BIG1,     type = ro,  define = yes;

    BIG2HDR:   load = BIG2HDR, type = ro;
    MD:        load = BIG2,     type = ro,  define = yes;
    DS:        load = BIG2,     type = ro,  define = yes;
    DA:        load = BIG2,     type = ro,  define = yes;
    DATA:      load = BIG2,     type = rw,  define = yes;


    # Trampolined load chunk
    TRAMPHDR:    load = TRAMPHDR, type = ro;
    TRAMPOLINED: load = TRAMP,   type = ro,  define = yes;
    VOR_PICS4:   load = TRAMP,   type = ro,  define = yes, optional = yes;
    CUEBALL:     load = TRAMP,   type = ro,  define = yes;

    # Startup stuff load chunk
    FONTSHDR:    load = FONTSHDR, type = ro;
    FONTDATA:    load = FONTS,   type = ro,  define = yes;
    ONCE:        load = FONTS,   type = ro,  define = yes;
    OPTIONS_BANK:  load = FONTS,    type = ro,    define = yes;

    AUTOSTRT:  load = TRAILER,    type = ro;
}
FEATURES {
    CONDES: type    = constructor,
            label   = __CONSTRUCTOR_TABLE__,
            count   = __CONSTRUCTOR_COUNT__,
            segment = ONCE;
    CONDES: type    = destructor,
            label   = __DESTRUCTOR_TABLE__,
            count   = __DESTRUCTOR_COUNT__,
            segment = RODATA;
    CONDES: type    = interruptor,
            label   = __INTERRUPTOR_TABLE__,
            count   = __INTERRUPTOR_COUNT__,
            segment = RODATA,
            import  = __CALLIRQ__;
}

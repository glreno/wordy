FEATURES {
    # There's a reason everyone uses $2000 here though.
    STARTADDRESS: default = $2000;
}
SYMBOLS {
    __EXEHDR__:          type = import;
    __STACKSIZE__:       type = weak,   value = $0200; # 512 byte stack
    __STARTADDRESS__:    type = export, value = %S;
    __RESERVED_MEMORY__: type = export, value = 0;
    DICT_BANK_1_ID:         type = export, value=0; # ID of dictionary index cart bank
    DICT_BANK_2_ID:         type = export, value=0; # ID of dictionary index cart bank
    DICT_IDX_ID:         type = export, value=0; # ID of dictionary index cart bank
}

MEMORY {
    ZP:         file = "", define = yes, start = $0082, size = $007E;

# file header, just $FFFF
    HEADER:     file = %O,               start = $0000, size = $0002;

    MAINHDR:    file = %O,               start = $0000, size = $0004;
    MAIN:       file = %O, define = yes, start = %S,    size = $BC20 - __STACKSIZE__ - __RESERVED_MEMORY__ - %S;
    TRAILER:    file = %O,               start = $0000, size = $0006;
}

SEGMENTS {
    # not on disk
    ZEROPAGE:  load = ZP,         type = zp;
    EXTZP:     load = ZP,         type = zp,                optional = yes;
    EXEHDR:    load = HEADER,     type = ro;

    MAINHDR:   load = MAINHDR,    type = ro;
    LOWCODE:   load = MAIN,       type = ro,  define = yes, optional = yes;
    DICT_BANK_1:  load = MAIN,    type = ro, define = yes, optional = yes;
    DICT_BANK_2:  load = MAIN,    type = ro, define = yes, optional = yes;
    DICT_IDX:  load = MAIN,       type = ro,  define = yes, optional = yes;
    STARTUP:   load = MAIN,       type = ro,  define = yes;
    INIT:      load = MAIN,       type = bss,               optional = yes;
    CODE:      load = MAIN,       type = ro,  define = yes, optional = yes;
    DATA:      load = MAIN,       type = rw,  define = yes;
    RODATA:    load = MAIN,       type = ro,  define = yes;
    LOWBSS:    load = MAIN,       type = rw,                optional = yes;  # not zero initialized
    BSS:       load = MAIN,       type = bss, define = yes;
    AUTOSTRT:  load = TRAILER,    type = ro;
}
FEATURES {
    CONDES: type    = constructor,
            label   = __CONSTRUCTOR_TABLE__,
            count   = __CONSTRUCTOR_COUNT__,
            segment = ONCE;
    CONDES: type    = destructor,
            label   = __DESTRUCTOR_TABLE__,
            count   = __DESTRUCTOR_COUNT__,
            segment = RODATA;
    CONDES: type    = interruptor,
            label   = __INTERRUPTOR_TABLE__,
            count   = __INTERRUPTOR_COUNT__,
            segment = RODATA,
            import  = __CALLIRQ__;
}
